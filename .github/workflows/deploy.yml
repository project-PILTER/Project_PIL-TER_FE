name: Frontend CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Actions 가상머신으로 최신 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. EC2로 전체 파일 전송 (전송 전 기존 유령 파일들 싹 청소하도록 RM 옵션 추가)
      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/frontend"
          rm: true # 🚨 핵심 1: 전송하기 전에 EC2의 target 폴더 내 기존 파일을 깨끗이 지웁니다. 유령 파일 박살용!

      # 3. 프론트엔드 자체 폴더에서 완벽하게 빌드 및 배포 실행
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 프론트엔드 소스 폴더로 이동합니다.
            cd /home/ubuntu/frontend

            # 2. 🔥 Next.js 빌드 시 환경변수가 주입되도록 .env 생성
            cat << EOF > .env
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_NAVER_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_CLIENT_ID }}
            NEXT_PUBLIC_NAVER_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_NAVER_REDIRECT_URI }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
            EOF

            # 3. 🚨 기존에 실행 중이던 프론트엔드 컨테이너를 안전하게 내리고 지웁니다.
            # (이름 충돌 Conflict 원천 차단)
            docker compose down || true
            docker rm -f pilter-FE || true

            # 4. 🚨 완전히 갱신된 파일과 .env로 캐시 없이 완전 생짜 새 빌드를 수행합니다.
            docker compose build --no-cache

            # 5. 프론트엔드 컨테이너 백그라운드 실행
            docker compose up -d

            # 6. 배포 상태 모니터링 (STATUS가 방금 켜진 상태인지 확인용)
            docker ps